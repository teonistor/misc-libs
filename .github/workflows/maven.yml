name: Java CI

on:
  workflow_dispatch:
    inputs:
      magicLink:
        description: 'Dummy input'
        required: true
        default: '12345'

jobs:
  printInputs:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Env: ${{ github.event.inputs.magicLink }}"
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: corretto
          cache: maven
      - name: Build with Maven
        run: mvn --batch-mode verify
